<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>配对 · whale-link</title>
<style>
  html,body{height:100%;margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 70% 10%,#eaf6ff,#cfe6f7 55%,#b6d4ea);color:#16324d;
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:min(92vw,420px);background:rgba(255,255,255,.94);border-radius:18px;padding:26px 22px;
    box-shadow:0 18px 44px rgba(16,48,80,.18);}
  h1{font-size:19px;margin:0 0 6px;}
  p{font-size:13px;line-height:1.7;color:#4c6a86;margin:6px 0;}
  code{background:#eef6fd;border-radius:6px;padding:2px 6px;font-size:13px;}
  input{width:100%;margin-top:14px;padding:13px 14px;font-size:20px;letter-spacing:6px;text-align:center;
    border:1px solid rgba(22,50,77,.16);border-radius:12px;outline:none;}
  button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#2f6ea6;color:#fff;font-size:16px;}
  #msg{margin-top:12px;font-size:13px;color:#c0392b;min-height:18px;text-align:center;}
  .hint{margin-top:14px;font-size:12px;color:#6a819a;}
</style>
</head>
<body>
<div class="card">
  <h1>和电脑配个对</h1>
  <p>电脑那边开着 whale-link，终端里会打印一个 6 位配对码（也可以点页面上的「换一个码」）。</p>
  <p>本机地址：<code id="addr">…</code></p>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="——————" autocomplete="one-time-code">
  <button id="go">配对</button>
  <div id="msg"></div>
  <div class="hint">配对成功后，这台手机 365 天内不用再输码。只在家里 Wi-Fi 下可用。</div>
</div>
<script>
$ = (s) => document.querySelector(s);
$("#addr").textContent = location.origin;
$("#go").onclick = async () => {
  const code = $("#code").value.trim();
  if (code.length !== 6) { $("#msg").textContent = "要 6 位数字"; return; }
  const r = await fetch("/api/pair", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code })
  });
  const j = await r.json();
  if (j.ok) { location.href = "/?t=" + encodeURIComponent(j.token || ""); } else { $("#msg").textContent = j.error || "配对失败"; }
};
$("#code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#go").click(); });
</script>
</body>
</html>
